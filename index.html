<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7FB">
<title>ウンメイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F7FB; --ink: #1F2333; --sub: #5A6078; --tile: #E6E8F0; --card: #FFFFFF;
  --accent: #E8484E; --gold: #FFC93C; --pink: #FF3D7F;
}
body.pachinko { --bg: #0E0F1A; --ink: #FFF4D6; --sub: #FFE08A; --tile: #2A2E4A; --card: #1B1F3A; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Zen Maru Gothic', sans-serif;
  transition: background .4s, color .4s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  overflow-x: hidden;
}
body.pachinko { background: radial-gradient(circle at 50% 40%, #2A1640 0%, #0E0F1A 65%) fixed; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus:not(:focus-visible) { outline: none; }
.display { font-family: 'Dela Gothic One', sans-serif; font-weight: 400; letter-spacing: .04em; }

#app {
  max-width: 520px; min-height: 100dvh; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; align-items: center; justify-content: space-between; height: 48px; flex-shrink: 0; }
header h1 { margin: 0; font-size: 30px; }
#modeTitle { font-weight: 900; font-size: 17px; }
.round {
  width: 44px; height: 44px; border: none; border-radius: 22px; background: var(--tile);
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.round svg { width: 22px; height: 22px; }
.hidden { display: none !important; }

/* setup */
#setup { display: flex; flex-direction: column; gap: 18px; flex-grow: 1; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: var(--tile); }
.tabs button { height: 44px; border: none; border-radius: 12px; background: transparent; font-weight: 700; font-size: 15px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.list-head { display: flex; align-items: baseline; justify-content: space-between; }
.list-head h2 { margin: 0; font-size: 18px; font-weight: 900; }
#count { font-size: 14px; color: var(--sub); font-weight: 700; }
#names { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.name-row { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 4px 0 14px; border-radius: 14px; background: var(--card); }
.name-row .dot { width: 14px; height: 14px; border-radius: 7px; flex-shrink: 0; }
.name-row .nm { flex-grow: 1; font-size: 19px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name-row .del { width: 44px; height: 44px; border: none; background: transparent; color: var(--sub); display: flex; align-items: center; justify-content: center; }
.add-row { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 4px 0 14px; border-radius: 14px; border: 2px dashed var(--sub); }
.add-row input { flex-grow: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 17px; color: var(--ink); outline: none; }
.add-row button { width: 44px; height: 44px; border: none; background: transparent; color: var(--sub); display: flex; align-items: center; justify-content: center; }
.hint { margin: 0; font-size: 13px; color: var(--sub); font-weight: 700; min-height: 18px; }
.grow { flex-grow: 1; }
.big-btn {
  height: 64px; border: none; border-radius: 20px; background: var(--accent); color: #FFFFFF;
  font-family: 'Dela Gothic One', sans-serif; font-size: 24px; letter-spacing: .08em; flex-shrink: 0;
  transition: transform .1s, opacity .2s;
}
.big-btn:active:not(:disabled) { transform: scale(.97); }
.big-btn:disabled { opacity: .4; }
body.pachinko .big-btn { background: var(--pink); }

/* play */
#play { display: flex; flex-direction: column; align-items: center; gap: 18px; flex-grow: 1; }
#stage { position: relative; width: 100%; display: flex; justify-content: center; }
#side { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
#statusBox { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 84px; text-align: center; }
#sub { margin: 0; font-size: 15px; font-weight: 700; color: var(--sub); min-height: 22px; }
#live { margin: 0; font-size: 34px; min-height: 48px; word-break: break-all; }
#actionBtn { width: 100%; }

.wheel-wrap { position: relative; width: min(100%, 58dvh, 460px); aspect-ratio: 344 / 372; }
.wheel-wrap svg.wheel { position: absolute; inset: 0; width: 100%; height: 100%; }
.bulbs { position: absolute; inset: 0; pointer-events: none; display: none; }
body.pachinko .bulbs { display: block; }
.bulb { position: absolute; width: 3.4%; aspect-ratio: 1; border-radius: 50%; background: #5A4A2A; transform: translate(-50%, -50%); }
body.pachinko .bulb { animation: blink .5s steps(1) infinite; }
body.pachinko .bulb.odd { animation-delay: .25s; }
@keyframes blink { 0% { background: var(--gold); box-shadow: 0 0 10px var(--gold); } 50% { background: #5A4A2A; box-shadow: none; } }

.amida { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.amida-row { display: grid; gap: 4px; }
.amida-row button, .amida-row .goal {
  min-width: 0; height: 44px; border: none; border-radius: 10px; font-weight: 900;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 2px; color: #1F2333;
}
.amida-row button:disabled { opacity: .45; }
.amida-row .goal {
  background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center;
  font-family: 'Dela Gothic One', sans-serif; transition: background .3s;
}
.amida-row .goal.lose { background: var(--tile); color: var(--sub); font-family: 'Zen Maru Gothic', sans-serif; }
.amida-row .goal.win { background: var(--accent); color: #FFFFFF; }
svg.amida-svg { width: 100%; height: min(50dvh, 440px); display: block; }

.kuji { width: 100%; display: grid; gap: 12px; }
.card {
  position: relative; aspect-ratio: 3 / 4; border: none; border-radius: 16px; padding: 0;
  background: #4D96FF; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font-family: 'Dela Gothic One', sans-serif; font-size: clamp(22px, 7vw, 40px);
  transition: transform .18s ease-in;
}
.card.flipping { transform: rotateY(90deg); }
.card.open { background: var(--card); color: var(--sub); border: 3px solid var(--tile); }
.card.open.win { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
.card .who { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 15px; }
.card .say { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 12px; min-height: 16px; }
.card.wobble { animation: wobble .5s ease-in-out infinite; }
body.pachinko .card.wobble { box-shadow: 0 0 24px var(--gold), 0 0 50px var(--pink); }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }

/* effects */
#banner {
  position: fixed; left: 50%; top: 30%; z-index: 20; pointer-events: none;
  padding: 6px 22px; border: 4px solid var(--gold); border-radius: 14px; background: var(--pink);
  box-shadow: 0 0 24px var(--pink), 0 0 60px rgba(255, 61, 127, .5);
  font-size: clamp(40px, 13vw, 72px); color: #FFF4D6; text-shadow: 3px 3px 0 #0E0F1A; white-space: nowrap;
  transform: translate(-50%, -50%) rotate(-6deg) scale(0); opacity: 0;
}
#banner.show { animation: banner 1.5s ease-out forwards; }
@keyframes banner {
  0% { transform: translate(-50%, -50%) rotate(-6deg) scale(0); opacity: 0; }
  15% { transform: translate(-50%, -50%) rotate(-6deg) scale(1.25); opacity: 1; }
  25%, 80% { transform: translate(-50%, -50%) rotate(-6deg) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) rotate(-6deg) scale(1.1); opacity: 0; }
}
#pop {
  position: fixed; left: 50%; top: 45%; z-index: 21; pointer-events: none;
  font-size: clamp(44px, 14vw, 80px); color: var(--gold); text-shadow: 0 0 18px rgba(255, 201, 60, .8), 3px 3px 0 #0E0F1A;
  transform: translate(-50%, -50%) scale(0); opacity: 0; white-space: nowrap;
}
#pop.show { animation: pop 1s ease-out forwards; }
@keyframes pop {
  0% { transform: translate(-50%, -50%) rotate(4deg) scale(2.2); opacity: 0; }
  20% { transform: translate(-50%, -50%) rotate(4deg) scale(1); opacity: 1; }
  75% { opacity: 1; }
  100% { transform: translate(-50%, -60%) rotate(4deg) scale(1); opacity: 0; }
}
.shake { animation: shake .4s linear; }
@keyframes shake {
  0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-10px, 6px); } 40% { transform: translate(9px, -6px); }
  60% { transform: translate(-6px, -4px); } 80% { transform: translate(5px, 4px); }
}
#flash { position: fixed; inset: 0; z-index: 19; pointer-events: none; background: #FFFFFF; opacity: 0; }
#flash.show { animation: flash .5s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

#result {
  position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px;
  background: rgba(14, 15, 26, .55);
}
.result-card {
  width: min(100%, 400px); padding: 28px 22px 22px; border-radius: 24px; background: var(--card); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 8px; animation: rise .35s ease-out;
}
body.pachinko .result-card { border: 3px solid var(--gold); box-shadow: 0 0 40px rgba(255, 201, 60, .4); }
@keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.result-card .label { font-size: 15px; font-weight: 700; color: var(--sub); }
#winnerName { margin: 0 0 12px; font-size: clamp(40px, 13vw, 60px); padding: 4px 20px; border-radius: 16px; color: #1F2333; word-break: break-all; text-align: center; }
.result-card .big-btn { width: 100%; }
.ghost-btn { width: 100%; height: 52px; border: none; border-radius: 16px; background: var(--tile); font-weight: 700; font-size: 16px; }
#confetti { position: fixed; inset: 0; z-index: 31; pointer-events: none; width: 100%; height: 100%; }

@media (orientation: landscape) and (min-width: 700px) {
  #app { max-width: 1100px; }
  #setup { width: 100%; max-width: 560px; margin: 0 auto; }
  #play { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, 1fr); align-items: center; gap: 32px; }
  .wheel-wrap { width: min(100%, 76dvh, 600px); }
  svg.amida-svg { height: min(58dvh, 520px); }
  .kuji { max-width: 640px; margin: 0 auto; }
  .card { font-size: clamp(22px, 4vh, 40px); }
}
@media (prefers-reduced-motion: reduce) {
  .bulb, .card.wobble { animation: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="backBtn" class="round hidden" aria-label="名前の入力に戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="logo" class="display">ウンメイ</h1>
    <span id="modeTitle" class="hidden"></span>
    <button id="muteBtn" class="round" aria-label="音を消す"></button>
  </header>

  <section id="setup">
    <div class="tabs" role="tablist" aria-label="遊び方">
      <button role="tab" data-mode="roulette" aria-selected="true">ルーレット</button>
      <button role="tab" data-mode="amida" aria-selected="false">あみだくじ</button>
      <button role="tab" data-mode="kuji" aria-selected="false">くじ引き</button>
    </div>
    <div class="list-head">
      <h2>だれが当たる？</h2>
      <span id="count"></span>
    </div>
    <ul id="names"></ul>
    <label class="add-row" id="addRow">
      <input id="nameInput" type="text" maxlength="10" enterkeyhint="done" autocomplete="off" placeholder="名前を入れて Enter">
      <button id="addBtn" type="button" aria-label="追加">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </label>
    <p class="hint" id="hint"></p>
    <div class="grow"></div>
    <button id="startBtn" class="big-btn">きめる！</button>
  </section>

  <section id="play" class="hidden">
    <div id="stage"></div>
    <div id="side">
      <div id="statusBox">
        <p id="sub"></p>
        <p id="live" class="display"></p>
      </div>
      <button id="actionBtn" class="big-btn"></button>
    </div>
  </section>
</div>

<div id="banner" class="display">激アツ!!</div>
<div id="pop" class="display">ガクン!!</div>
<div id="flash"></div>
<div id="result" class="hidden" role="dialog" aria-modal="true" aria-labelledby="winnerName">
  <div class="result-card">
    <span class="label">決定</span>
    <p id="winnerName" class="display"></p>
    <button id="againBtn" class="big-btn">もう一回</button>
    <button id="editBtn" class="ghost-btn">名前を変える</button>
  </div>
</div>
<canvas id="confetti" class="hidden"></canvas>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const COLORS = ['#FF6B6B', '#FFB547', '#FFE066', '#6BCB77', '#4D96FF', '#B98CFF', '#FF8FC7', '#4ECDC4', '#FF9F6B', '#A8D85C', '#7FB8FF', '#E0A3FF'];
const RIGGED = /後藤|ごと|ゴト/;
const MAX = 12;
const MODE_NAMES = { roulette: 'ルーレット', amida: 'あみだくじ', kuji: 'くじ引き' };

const state = { mode: 'roulette', names: [], muted: false, busy: false, winner: -1, special: null };
try { state.muted = localStorage.getItem('unmei_muted') === '1'; } catch (e) {}

const color = (i) => COLORS[i % COLORS.length];
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (n) => Math.floor(Math.random() * n);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (v, m) => ((v % m) + m) % m;
const easeOutCubic = (k) => 1 - Math.pow(1 - k, 3);
const easeOutQuint = (k) => 1 - Math.pow(1 - k, 5);
const easeOutBack = (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const linear = (k) => k;

/* ---------- sound ---------- */
let ac = null;
function audio() {
  if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type = 'square', vol = 0.06, when = 0, toFreq = 0) {
  if (state.muted) return;
  const c = audio(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  const t = c.currentTime + when;
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  tick: () => tone(1400, 0.03, 'square', 0.035),
  step: () => tone(880, 0.05, 'triangle', 0.05),
  add: () => tone(660, 0.06, 'triangle', 0.05),
  hazure: () => { tone(330, 0.15, 'triangle', 0.07); tone(247, 0.25, 'triangle', 0.07, 0.15); },
  fanfare: () => { [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'square', 0.05, i * 0.12)); tone(1047, 0.6, 'square', 0.06, 0.36); tone(784, 0.6, 'triangle', 0.05, 0.36); },
  special: () => {
    tone(200, 0.7, 'sawtooth', 0.05, 0, 1600);
    for (let i = 0; i < 6; i++) tone(i % 2 ? 1319 : 1760, 0.09, 'square', 0.045, 0.7 + i * 0.1);
  },
  gakun: () => { tone(110, 0.35, 'sawtooth', 0.12, 0, 45); tone(70, 0.4, 'square', 0.08); },
  suspense: () => { for (let i = 0; i < 4; i++) tone(440 + i * 110, 0.12, 'square', 0.035, i * 0.18); },
};
function renderMute() {
  const btn = $('#muteBtn');
  btn.setAttribute('aria-label', state.muted ? '音を出す' : '音を消す');
  btn.innerHTML = state.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
}
$('#muteBtn').addEventListener('click', () => {
  state.muted = !state.muted;
  try { localStorage.setItem('unmei_muted', state.muted ? '1' : '0'); } catch (e) {}
  renderMute();
  if (!state.muted) sfx.add();
});

/* ---------- setup ---------- */
function renderList() {
  const ul = $('#names');
  ul.innerHTML = '';
  state.names.forEach((n, i) => {
    const li = document.createElement('li');
    li.className = 'name-row';
    li.innerHTML = '<span class="dot"></span><span class="nm"></span><button class="del" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    li.querySelector('.dot').style.background = color(i);
    li.querySelector('.nm').textContent = n;
    const del = li.querySelector('.del');
    del.setAttribute('aria-label', n + 'を消す');
    del.addEventListener('click', () => { state.names.splice(i, 1); renderList(); });
    ul.appendChild(li);
  });
  const full = state.names.length >= MAX;
  $('#count').textContent = state.names.length + '人 / ' + MAX + '人まで';
  $('#addRow').classList.toggle('hidden', full);
  $('#startBtn').disabled = state.names.length < 2;
  $('#hint').textContent = state.names.length < 2 ? '2人以上入れてね' : (full ? 'これ以上は入れられないよ' : '');
}
function addName() {
  const input = $('#nameInput');
  const v = input.value.trim();
  if (!v || state.names.length >= MAX) return;
  state.names.push(v);
  input.value = '';
  sfx.add();
  renderList();
  input.focus();
}
$('#nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); addName(); }
});
$('#addBtn').addEventListener('click', addName);
document.querySelectorAll('.tabs button').forEach((b) => {
  b.addEventListener('click', () => {
    state.mode = b.dataset.mode;
    document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  });
});
$('#startBtn').addEventListener('click', () => {
  const v = $('#nameInput').value.trim();
  if (v && state.names.length < MAX) addName();
  audio();
  startGame();
});

/* ---------- game flow ---------- */
function pickWinner() {
  const all = state.names.map((_, i) => i);
  const rigged = all.filter((i) => RIGGED.test(state.names[i]));
  const pool = rigged.length ? rigged : all;
  return pool[randInt(pool.length)];
}
function rollSpecial() {
  if (Math.random() >= 0.4) return null;
  return Math.random() < 0.5 ? 'pachinko' : 'gakun';
}
function showScreen(play) {
  $('#setup').classList.toggle('hidden', play);
  $('#play').classList.toggle('hidden', !play);
  $('#backBtn').classList.toggle('hidden', !play);
  $('#logo').classList.toggle('hidden', play);
  $('#modeTitle').classList.toggle('hidden', !play);
}
function setStatus(sub, live) {
  if (sub !== undefined) $('#sub').textContent = sub;
  if (live !== undefined) $('#live').textContent = live;
}
function setBusy(b) {
  state.busy = b;
  $('#backBtn').disabled = b;
  $('#actionBtn').disabled = b;
}
function startGame() {
  document.body.classList.remove('pachinko');
  $('#result').classList.add('hidden');
  state.winner = pickWinner();
  state.special = rollSpecial();
  $('#modeTitle').textContent = MODE_NAMES[state.mode];
  showScreen(true);
  setBusy(false);
  setStatus('', '');
  if (state.mode === 'roulette') buildRoulette();
  else if (state.mode === 'amida') buildAmida();
  else buildKuji();
}
$('#backBtn').addEventListener('click', () => {
  if (state.busy) return;
  document.body.classList.remove('pachinko');
  showScreen(false);
});
$('#againBtn').addEventListener('click', startGame);
$('#editBtn').addEventListener('click', () => {
  document.body.classList.remove('pachinko');
  $('#result').classList.add('hidden');
  showScreen(false);
});

async function enterPachinko() {
  document.body.classList.add('pachinko');
  const b = $('#banner');
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  flash();
  sfx.special();
  await wait(1500);
}
function flash() {
  const f = $('#flash');
  f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
}
function gakun(text = 'ガクン!!') {
  const app = $('#app'), p = $('#pop');
  p.textContent = text;
  app.classList.remove('shake'); p.classList.remove('show');
  void app.offsetWidth;
  app.classList.add('shake'); p.classList.add('show');
  sfx.gakun();
}
async function finish(w) {
  setBusy(true);
  await wait(500);
  const name = $('#winnerName');
  name.textContent = state.names[w];
  name.style.background = color(w);
  $('#result').classList.remove('hidden');
  if (document.body.classList.contains('pachinko')) flash();
  sfx.fanfare();
  confetti();
  setBusy(false);
  $('#againBtn').focus();
}

/* ---------- roulette ---------- */
const WC = 160, WR = 150;
let wheel = null;
function buildRoulette() {
  const n = state.names.length, A = 360 / n;
  const pt = (a) => { const r = a * Math.PI / 180; return (WC + WR * Math.sin(r)).toFixed(2) + ' ' + (WC - WR * Math.cos(r)).toFixed(2); };
  const fs = n <= 4 ? 26 : n <= 6 ? 23 : n <= 9 ? 19 : 16;
  let slices = '', lines = '', labels = '';
  state.names.forEach((nm, i) => {
    slices += '<path d="M' + WC + ' ' + WC + ' L' + pt(i * A) + ' A' + WR + ' ' + WR + ' 0 0 1 ' + pt((i + 1) * A) + ' Z" fill="' + color(i) + '"/>';
    lines += '<line x1="' + WC + '" y1="' + WC + '" x2="' + pt(i * A).replace(' ', '" y2="') + '"/>';
    // Labels run along the radius; on the left half they are turned over so they never read upside down.
    const mid = (i + 0.5) * A, left = mid > 180;
    labels += '<text x="' + (left ? WC - WR * 0.6 : WC + WR * 0.6) + '" y="' + WC + '" transform="rotate(' + (left ? mid + 90 : mid - 90) + ' ' + WC + ' ' + WC + ')"></text>';
  });
  let bulbs = '';
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2;
    const x = (12 + WC + 166 * Math.sin(a)) / 344 * 100;
    const y = (40 + WC - 166 * Math.cos(a)) / 372 * 100;
    bulbs += '<span class="bulb' + (i % 2 ? ' odd' : '') + '" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%"></span>';
  }
  $('#stage').innerHTML =
    '<div class="wheel-wrap"><div class="bulbs">' + bulbs + '</div>' +
    '<svg class="wheel" viewBox="-12 -40 344 372" role="img" aria-label="ルーレット">' +
    '<circle cx="' + WC + '" cy="' + WC + '" r="' + (WR + 6) + '" fill="#FFFFFF" stroke="#1F2333" stroke-width="5"/>' +
    '<g id="rot">' + slices +
    '<g stroke="#FFFFFF" stroke-width="3">' + (n > 1 ? lines : '') + '</g>' +
    '<g font-family="Zen Maru Gothic, sans-serif" font-weight="900" font-size="' + fs + '" fill="#1F2333" text-anchor="middle" dominant-baseline="central">' + labels + '</g>' +
    '</g>' +
    '<circle cx="' + WC + '" cy="' + WC + '" r="24" fill="#FFFFFF" stroke="#1F2333" stroke-width="5"/>' +
    '<circle cx="' + WC + '" cy="' + WC + '" r="8" fill="#1F2333"/>' +
    '<path d="M144 -32 L176 -32 L160 16 Z" fill="#E8484E" stroke="#1F2333" stroke-width="4" stroke-linejoin="round"/>' +
    '</svg></div>';
  const texts = $('#stage').querySelectorAll('text');
  state.names.forEach((nm, i) => { texts[i].textContent = nm.length > 6 ? nm.slice(0, 5) + '…' : nm; });
  wheel = { n, A, R: rand(0, 360), last: -1, g: $('#rot') };
  applyRot(true);
  setStatus('タップで回そう', '');
  const btn = $('#actionBtn');
  btn.classList.remove('hidden');
  btn.textContent = '回す！';
  btn.onclick = spinRoulette;
}
function sliceAt(R) { return Math.floor(mod(-R, 360) / wheel.A) % wheel.n; }
function applyRot(silent) {
  wheel.g.setAttribute('transform', 'rotate(' + wheel.R.toFixed(3) + ' ' + WC + ' ' + WC + ')');
  const idx = sliceAt(wheel.R);
  if (idx !== wheel.last) {
    wheel.last = idx;
    if (!silent) { sfx.tick(); $('#live').textContent = state.names[idx]; }
  }
}
function animRot(to, dur, ease) {
  return new Promise((res) => {
    const from = wheel.R, t0 = performance.now();
    const f = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      wheel.R = from + (to - from) * ease(k);
      applyRot(false);
      if (k < 1) requestAnimationFrame(f); else res();
    };
    requestAnimationFrame(f);
  });
}
// Rotation that puts wheel angle p under the pointer, ahead of the current one.
function rotFor(p) { return wheel.R + mod(-p - wheel.R, 360); }
async function spinRoulette() {
  if (state.busy) return;
  setBusy(true);
  const { A, n } = wheel, w = state.winner, sp = state.special;
  const small = () => clamp(A * rand(0.04, 0.12), 1.2, 6);
  setStatus('', '');
  if (sp === 'pachinko') { await enterPachinko(); setStatus('リーチ…!!'); }
  if (sp === 'gakun' && n > 1) {
    const others = [...Array(n).keys()].filter((i) => i !== w);
    const o = others[randInt(others.length)];
    await animRot(rotFor(o * A + A * rand(0.35, 0.65)) + 360 * 5, 5200, easeOutCubic);
    setStatus('決定…？', state.names[o]);
    sfx.suspense();
    await wait(1400);
    const d = mod(-(w * A + A * rand(0.3, 0.7)) - wheel.R + 180, 360) - 180;
    gakun();
    await animRot(wheel.R + d, 280, easeOutBack);
  } else {
    const turns = 360 * (sp === 'pachinko' ? 7 : 5);
    const dur = sp === 'pachinko' ? 8500 : 5200;
    const ease = sp === 'pachinko' ? easeOutQuint : easeOutCubic;
    const r = Math.random();
    if (r < 0.4) {
      await animRot(rotFor((w + 1) * A - small()) + turns, dur, ease);
    } else if (r < 0.7) {
      await animRot(rotFor(w * A + small()) + turns, dur, ease);
    } else {
      const s = small();
      await animRot(rotFor(w * A - s) + turns, dur, ease);
      await wait(750);
      await animRot(wheel.R - s * 2.2, 420, easeOutBack);
    }
  }
  setStatus('', state.names[w]);
  finish(w);
}

/* ---------- amida ---------- */
let amida = null;
function buildAmida() {
  const n = state.names.length, W = 100 * n, H = 600, L = 10;
  const x = (c) => 100 * c + 50;
  const y = (l) => 50 + l * (H - 100) / (L - 1);
  const levels = [];
  for (let l = 0; l < L; l++) {
    const row = [];
    for (let c = 0; c < n - 1; c++) { if (!row.includes(c - 1) && Math.random() < 0.3) row.push(c); }
    levels.push(row);
  }
  for (let c = 0; c < n - 1; c++) {
    if (levels.some((r) => r.includes(c))) continue;
    const free = levels.map((_, l) => l).filter((l) => !levels[l].includes(c - 1) && !levels[l].includes(c + 1));
    const l = free.length ? free[randInt(free.length)] : randInt(L);
    levels[l] = levels[l].filter((v) => v !== c - 1 && v !== c + 1);
    levels[l].push(c);
  }
  const trace = (col) => {
    const pts = [[x(col), 0]];
    levels.forEach((row, l) => {
      if (row.includes(col - 1)) { pts.push([x(col), y(l)]); col--; pts.push([x(col), y(l)]); }
      else if (row.includes(col)) { pts.push([x(col), y(l)]); col++; pts.push([x(col), y(l)]); }
    });
    pts.push([x(col), H]);
    return { end: col, pts };
  };
  let lines = '';
  for (let c = 0; c < n; c++) lines += '<line x1="' + x(c) + '" y1="0" x2="' + x(c) + '" y2="' + H + '"/>';
  levels.forEach((row, l) => row.forEach((c) => { lines += '<line x1="' + x(c) + '" y1="' + y(l) + '" x2="' + x(c + 1) + '" y2="' + y(l) + '"/>'; }));
  const cols = 'grid-template-columns: repeat(' + n + ', minmax(0, 1fr))';
  const fs = n <= 5 ? 16 : n <= 8 ? 13 : 11;
  $('#stage').innerHTML =
    '<div class="amida">' +
    '<div class="amida-row" id="amidaNames" style="' + cols + '"></div>' +
    '<svg class="amida-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<g stroke="currentColor" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke" style="color: var(--ink)">' +
    lines.replace(/<line /g, '<line vector-effect="non-scaling-stroke" ') + '</g><g id="amidaPaths"></g></svg>' +
    '<div class="amida-row" id="amidaGoals" style="' + cols + '"></div>' +
    '</div>';
  const namesRow = $('#amidaNames'), goalsRow = $('#amidaGoals');
  state.names.forEach((nm, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = nm;
    b.title = nm;
    b.style.background = color(i);
    b.style.fontSize = fs + 'px';
    b.setAttribute('aria-label', nm + 'の線をたどる');
    b.addEventListener('click', () => traceOne(i));
    namesRow.appendChild(b);
    const g = document.createElement('div');
    g.className = 'goal';
    g.textContent = '？';
    goalsRow.appendChild(g);
  });
  amida = { n, H, trace, done: new Set(), win: trace(state.winner).end };
  setStatus('名前をタップしてたどろう', '');
  const btn = $('#actionBtn');
  btn.classList.remove('hidden');
  btn.textContent = 'まとめてたどる';
  btn.onclick = traceAll;
}
function partial(pts, len) {
  const out = [pts[0]];
  let left = len;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (left >= seg) { out.push(pts[i]); left -= seg; continue; }
    const k = left / seg;
    out.push([x0 + (x1 - x0) * k, y0 + (y1 - y0) * k]);
    break;
  }
  return out;
}
function drawTrace(i, pts, dur) {
  const ns = 'http://www.w3.org/2000/svg';
  const under = document.createElementNS(ns, 'polyline');
  const over = document.createElementNS(ns, 'polyline');
  [[under, '#1F2333', 11], [over, color(i), 7]].forEach(([el, c, wdt]) => {
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', c);
    el.setAttribute('stroke-width', wdt);
    el.setAttribute('stroke-linecap', 'round');
    el.setAttribute('stroke-linejoin', 'round');
    el.setAttribute('vector-effect', 'non-scaling-stroke');
    $('#amidaPaths').appendChild(el);
  });
  if (document.body.classList.contains('pachinko')) over.style.filter = 'drop-shadow(0 0 6px ' + color(i) + ')';
  let total = 0;
  for (let k = 1; k < pts.length; k++) total += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
  return new Promise((res) => {
    const t0 = performance.now();
    let corners = 0;
    const f = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      const p = partial(pts, total * k);
      const s = p.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
      under.setAttribute('points', s);
      over.setAttribute('points', s);
      if (p.length - 1 > corners) { corners = p.length - 1; if (corners % 2 === 0) sfx.step(); }
      if (k < 1) requestAnimationFrame(f); else res();
    };
    requestAnimationFrame(f);
  });
}
async function traceOne(i) {
  if (state.busy || amida.done.has(i)) return;
  setBusy(true);
  amida.done.add(i);
  $('#amidaNames').children[i].disabled = true;
  const isWin = i === state.winner, sp = isWin ? state.special : null;
  const { end, pts } = amida.trace(i);
  if (sp === 'pachinko') await enterPachinko();
  setStatus(isWin && sp === 'pachinko' ? 'リーチ…!!' : 'たどってます…', state.names[i]);
  await drawTrace(i, pts, sp === 'pachinko' ? 5000 : 2400);
  const goal = $('#amidaGoals').children[end];
  if (!isWin) {
    goal.classList.add('lose');
    goal.textContent = 'ハズレ';
    sfx.hazure();
    setStatus('セーフ！', state.names[i]);
    setBusy(false);
    return;
  }
  if (sp === 'gakun') {
    goal.classList.add('lose');
    goal.textContent = 'ハズレ';
    setStatus('セーフ…？', state.names[i]);
    sfx.hazure();
    await wait(1300);
    gakun();
    goal.classList.remove('lose');
  } else {
    sfx.suspense();
    await wait(700);
  }
  goal.classList.add('win');
  goal.textContent = '当たり';
  setStatus('', state.names[i]);
  finish(i);
}
async function traceAll() {
  if (state.busy) return;
  const order = [...Array(amida.n).keys()].filter((i) => i !== state.winner && !amida.done.has(i)).sort(() => Math.random() - 0.5);
  order.push(state.winner);
  for (const i of order) {
    await traceOne(i);
    if (i !== state.winner) await wait(300);
  }
}

/* ---------- kuji ---------- */
let kuji = null;
function buildKuji() {
  const n = state.names.length, w = state.winner;
  const order = [...Array(n).keys()].filter((i) => i !== w).sort(() => Math.random() - 0.5);
  const pos = Math.floor(n / 2) + randInt(n - Math.floor(n / 2));
  order.splice(pos, 0, w);
  kuji = { order, turn: 0 };
  const cols = n <= 4 ? 2 : n <= 9 ? 3 : 4;
  const grid = document.createElement('div');
  grid.className = 'kuji';
  grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
  for (let k = 0; k < n; k++) {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'card';
    c.textContent = '？';
    c.setAttribute('aria-label', 'カードをめくる');
    c.addEventListener('click', () => pickCard(c));
    grid.appendChild(c);
  }
  $('#stage').innerHTML = '';
  $('#stage').appendChild(grid);
  $('#actionBtn').classList.add('hidden');
  kujiTurn();
}
function kujiTurn() {
  setStatus('つぎは', state.names[kuji.order[kuji.turn]] + ' の番');
}
function flipCard(card, html, cls) {
  return new Promise((res) => {
    card.classList.add('flipping');
    setTimeout(() => {
      card.innerHTML = html;
      card.className = 'card open' + (cls ? ' ' + cls : '');
      res();
    }, 180);
  });
}
function cardHtml(name, word, say) {
  const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  return '<span class="who">' + esc(name) + '</span><span>' + word + '</span><span class="say">' + (say || '') + '</span>';
}
async function pickCard(card) {
  if (state.busy || card.classList.contains('open')) return;
  setBusy(true);
  const p = kuji.order[kuji.turn], name = state.names[p];
  card.setAttribute('aria-label', name + 'のカード');
  if (p !== state.winner) {
    const next = kuji.order[kuji.turn + 1];
    const say = next === state.winner ? 'あぶなかった〜' : ['セーフ！', 'ふぅ…', 'よかった〜'][randInt(3)];
    await flipCard(card, cardHtml(name, 'ハズレ', say));
    sfx.hazure();
    kuji.turn++;
    await wait(400);
    kujiTurn();
    setBusy(false);
    return;
  }
  const sp = state.special;
  if (sp === 'pachinko') {
    await enterPachinko();
    setStatus('リーチ…!!', name);
    card.classList.add('wobble');
    sfx.suspense();
    await wait(1800);
    card.classList.remove('wobble');
  } else if (sp === 'gakun') {
    await flipCard(card, cardHtml(name, 'ハズレ', 'セーフ…？'));
    sfx.hazure();
    await wait(1300);
    gakun();
  } else {
    card.classList.add('wobble');
    sfx.suspense();
    await wait(900);
    card.classList.remove('wobble');
  }
  await flipCard(card, cardHtml(name, '当たり', ''), 'win');
  setStatus('', name);
  finish(p);
}

/* ---------- confetti ---------- */
function confetti() {
  const cv = $('#confetti');
  cv.classList.remove('hidden');
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);
  const pal = document.body.classList.contains('pachinko') ? ['#FFC93C', '#FF3D7F', '#FFF4D6', '#7FB8FF'] : COLORS;
  const ps = Array.from({ length: 140 }, () => ({
    x: rand(0, innerWidth), y: rand(-innerHeight * 0.6, -10), vx: rand(-1.2, 1.2), vy: rand(2, 5),
    r: rand(0, Math.PI), vr: rand(-0.2, 0.2), w: rand(6, 11), h: rand(8, 15), c: pal[randInt(pal.length)],
  }));
  const t0 = performance.now();
  const f = (now) => {
    g.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
      g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); g.restore();
    });
    if (now - t0 < 3200) requestAnimationFrame(f); else cv.classList.add('hidden');
  };
  requestAnimationFrame(f);
}

renderMute();
renderList();
</script>
